[pytest]
minversion = 7.0
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
norecursedirs = venv .venv __pycache__ .git

markers =
    unit: prueba unitaria pura (no construye Flask ni toca la base de datos)
    integration: prueba de integración (construye la app Flask y usa test_client)
