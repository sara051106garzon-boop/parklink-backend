[pytest]
# Directorio donde pytest buscará los archivos de prueba
testpaths = tests

# Patrón para identificar los archivos de prueba
python_files = test_*.py

# Añade la raíz del proyecto al PATH para importar la carpeta 'app' sin errores
pythonpath = .

# Opciones por defecto al ejecutar el comando pytest
addopts = -v --tb=short