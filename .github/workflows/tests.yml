name: Pruebas

# Se ejecuta en cada push (a cualquier rama) y en cada Pull Request hacia main.
# Así cada integrante ve si sus pruebas rompen algo antes de pedir el merge.
#
# Los mismos pasos se reutilizan desde "Despliegue a AWS EC2" mediante la acción
# compuesta .github/actions/pruebas-parklink, de modo que el despliegue solo
# ocurre si esta misma suite pasa.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # Sin `environment:`: este job no recibe los secrets de staging ni de
      # production. La suite corre sobre SQLite en memoria.
      - name: Ejecutar la suite de pruebas
        uses: ./.github/actions/pruebas-parklink
